name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        xray-version: ["26.6.1", "26.11.9"]

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Fmt
      run: test -z "$(gofmt -l .)"

    - name: Vet
      run: go vet ./...

    - name: Installer regression checks
      run: sh tests/installer.sh

    - name: Download Xray
      run: |
        curl -sSfLo "$RUNNER_TEMP/xray.zip" https://github.com/XTLS/Xray-core/releases/download/v${{ matrix.xray-version }}/Xray-linux-64.zip
        unzip -o "$RUNNER_TEMP/xray.zip" xray -d "$RUNNER_TEMP/xray"
        echo "XRAY_BINARY=$RUNNER_TEMP/xray/xray" >> "$GITHUB_ENV"

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Cross-compile arm64
      env:
        GOOS: linux
        GOARCH: arm64
        CGO_ENABLED: "0"
      run: go build -trimpath -o "$RUNNER_TEMP/xkeen-subscription-watcher-linux-arm64" .
